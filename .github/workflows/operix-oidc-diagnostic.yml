name: Temporary Operix staging OIDC claims diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  claims:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment: operix-staging
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Inspect allowlisted OIDC claims
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          try {
            const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
            url.searchParams.set('audience', 'sts.amazonaws.com');
            const r = await fetch(url, {headers: {Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}`}, redirect: 'error', signal: AbortSignal.timeout(15000)});
            if (!r.ok) throw new Error();
            const {value} = await r.json();
            const parts = typeof value === 'string' ? value.split('.') : [];
            if (parts.length !== 3) throw new Error();
            const p = JSON.parse(Buffer.from(parts[1], 'base64url').toString('utf8'));
            for (const k of ['iss','aud','sub','repository','ref','environment']) if (Object.hasOwn(p,k)) console.log(`${k}: ${JSON.stringify(p[k])}`);
          } catch { console.error('OIDC diagnostic failed; sensitive details withheld.'); process.exitCode = 1; }
          NODE
