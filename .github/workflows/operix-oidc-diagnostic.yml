name: Temporary Operix OIDC claims diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  claims:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment: operix-images
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Diagnose OIDC claims (allowlisted payload only)
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          try {
            const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
            url.searchParams.set('audience', 'sts.amazonaws.com');
            const response = await fetch(url, {
              headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
              signal: AbortSignal.timeout(15000),
              redirect: 'error',
            });
            if (!response.ok) throw new Error('OIDC request failed');
            const { value } = await response.json();
            const parts = typeof value === 'string' ? value.split('.') : [];
            if (parts.length !== 3) throw new Error('Invalid JWT');
            const payload = JSON.parse(Buffer.from(parts[1], 'base64url').toString('utf8'));
            for (const key of ['iss', 'aud', 'sub', 'repository', 'ref', 'environment']) {
              if (Object.hasOwn(payload, key)) {
                console.log(`${key}: ${JSON.stringify(payload[key])}`);
              }
            }
          } catch {
            console.error('OIDC claim diagnostic failed; sensitive error details withheld.');
            process.exitCode = 1;
          }
          NODE
