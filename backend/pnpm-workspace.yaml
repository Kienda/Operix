packages:
  - 'apps/*'
  - 'packages/*'

# Prisma 6's config loader uses the same deepmerge API. Version 8 fixes the
# recursive-object advisory; generation and migration gates verify compatibility.
overrides:
  'deepmerge-ts@>=7 <8': 8.0.0
  'vite@<6.4.3': 6.4.3
  'js-yaml@>=5 <5.4.1': 5.4.1

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  argon2: true
  esbuild: true
  msgpackr-extract: true
  prisma: true

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - prisma
  - argon2
  - esbuild
  - msgpackr-extract
  - '@scarf/scarf'
