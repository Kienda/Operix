packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  argon2: true
  esbuild: true
  msgpackr-extract: true
  prisma: true

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - prisma
  - argon2
  - esbuild
  - msgpackr-extract
  - '@scarf/scarf'

# Security pins where upstream still pins vulnerable transitives.
# Compatibility rationale and validation: ../docs/dependency-security.md.
overrides:
  proxy-addr: 2.0.8
  qs: 6.16.0
  multer: 2.4.0
  'js-yaml@>=4 <5': 4.3.2
  'js-yaml@>=5 <6': 5.4.2
  'fast-uri@>=3 <4': 3.1.8
  'brace-expansion@<2': 1.1.21
  'brace-expansion@>=5 <6': 5.0.12
  # Prisma 6 pins 7.1.5; no patched 7.x exists. Scope the major override to
  # Prisma config only; validate generate/config loading/migrations before release.
  '@prisma/config>deepmerge-ts': 8.0.2
  nanoid: 3.3.18
  source-map-js: 1.2.2
