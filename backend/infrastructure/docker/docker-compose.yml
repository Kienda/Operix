name: operix

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: operix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: operix
      POSTGRES_PASSWORD: operix
      POSTGRES_DB: operix
    ports:
      # Host port shifted off 5432 — a native PostgreSQL install often already
      # owns that port on developer machines, which silently steals the
      # connection instead of erroring.
      - '55432:5432'
    volumes:
      - operix-postgres:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U operix -d operix']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: operix-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - operix-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: operix-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - operix-minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done;
      mc mb --ignore-existing local/operix-documents;
      mc anonymous set none local/operix-documents;
      exit 0;
      "

  mailpit:
    image: axllent/mailpit:latest
    container_name: operix-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  operix-postgres:
  operix-redis:
  operix-minio:
