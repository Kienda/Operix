# Included in the server block AND in every location that sets its own
# add_header: nginx drops inherited add_header directives in such locations.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy same-origin always;
add_header X-Frame-Options DENY always;
add_header X-Robots-Tag "noindex, nofollow" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# The pilot ships no inline script/style; the MFA QR code is a locally rendered data: image.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
# Honoured by browsers only over HTTPS (the TLS edge). No includeSubDomains: other GHT hosts are unaffected.
add_header Strict-Transport-Security "max-age=31536000" always;
