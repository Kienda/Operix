server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $operix_api api:4000;
    include /etc/nginx/snippets/operix-security-headers.conf;
    client_max_body_size 1m;
    location = /healthz { access_log off; return 200 'ok'; }
    # Internal platform administration is not served by the public application
    # hostname. A separately approved private administrative route is required.
    location ~* ^/api/v1/platform(/|$) { return 404; }
    location ~* ^/(docs|metrics|debug|api/docs|api/metrics|api/debug)(/|$) { return 404; }
    location /api/ {
        proxy_pass http://$operix_api$request_uri;
        proxy_set_header Host $host;
        # The approved edge proxy sets these. Direct host access is loopback only.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
    # Each location that sets add_header must re-include the security headers.
    location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; include /etc/nginx/snippets/operix-security-headers.conf; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-store"; include /etc/nginx/snippets/operix-security-headers.conf; }
}
